<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16">
<style>
.r{fill:#0969da;transform-box:fill-box;transform-origin:center}
.g{transform-box:fill-box;transform-origin:center;animation:g 4s ease-in-out infinite}
.c{fill:#0969da;animation:d 4s ease-in-out infinite}
@keyframes g{0%,15%{opacity:0;transform:scale(.55)}40%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
@keyframes d{0%{opacity:0}20%,70%{opacity:1}100%{opacity:0}}
@media (prefers-color-scheme: dark){.r{fill:#4493f8}.c{fill:#ffffff}}
</style>
<g class="g">
<circle class="r" cx="8" cy="8" r="6.5" fill-opacity=".14"/>
<circle class="r" cx="8" cy="8" r="4.8" fill-opacity=".18"/>
<circle class="r" cx="8" cy="8" r="3.2" fill-opacity=".22"/>
</g>
<circle class="c" cx="8" cy="8" r="1.5"/>
</svg>
