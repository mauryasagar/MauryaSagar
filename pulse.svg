<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
<style>
.c{fill:#1f2328;transform-box:fill-box;transform-origin:center;animation:p 2s ease-in-out infinite}
@keyframes p{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
@media (prefers-color-scheme: dark){.c{fill:#ffffff}}
</style>
<circle class="c" cx="8" cy="8" r="1.8"/>
</svg>
