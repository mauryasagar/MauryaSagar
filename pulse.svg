<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
<style>
.c{fill:#1f2328}
@media (prefers-color-scheme: dark){.c{fill:#ffffff}}
</style>
<g fill="#4493f8" opacity="0">
<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.15;0.4;1" dur="4s" repeatCount="indefinite"/>
<circle cx="8" cy="8" r="6.2" fill-opacity=".14">
<animate attributeName="r" values="3.4;3.4;6.8" keyTimes="0;0.15;1" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="8" cy="8" r="4.6" fill-opacity=".18">
<animate attributeName="r" values="2.5;2.5;5.1" keyTimes="0;0.15;1" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="8" cy="8" r="3" fill-opacity=".22">
<animate attributeName="r" values="1.65;1.65;3.3" keyTimes="0;0.15;1" dur="4s" repeatCount="indefinite"/>
</circle>
</g>
<circle class="c" cx="8" cy="8" r="1.6" opacity="0">
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.7;1" dur="4s" repeatCount="indefinite"/>
</circle>
</svg>
